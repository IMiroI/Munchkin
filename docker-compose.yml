services:
  redis:
    image: redis:7-alpine
    container_name: munchkin-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: munchkin-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: munchkin
      POSTGRES_USER: munchkin
      POSTGRES_PASSWORD: munchkin
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U munchkin"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  postgres-data:
