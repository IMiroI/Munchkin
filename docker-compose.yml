services:
  redis:
    image: redis:7-alpine
    container_name: munchkin-redis
    # ports:
    #   - "6379:6379"  # non exposé sur l'hôte, accès réseau Docker interne uniquement
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: munchkin-postgres
    # ports:
    #   - "5432:5432"  # non exposé sur l'hôte, accès réseau Docker interne uniquement
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-munchkin}
      POSTGRES_USER: ${POSTGRES_USER:-munchkin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-munchkin}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    env_file:
      - .env

volumes:
  redis-data:
  postgres-data:
